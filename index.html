<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>little-dialkit demo</title>
    <style>
      body { display: flex; gap: 32px; margin: 0; padding: 24px; background: #161616; color: #999; }
      #panel { flex: none; width: 300px; }
      #values { margin: 0; font: 12px/1.5 monospace; }
      nav { display: flex; flex-direction: column; gap: 4px; font: 12px/1.5 monospace; }
      nav a { color: inherit; }
      canvas { display: block; margin: 16px 0; }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div>
      <nav>
        <a href="/">floating (default)</a>
        <a href="/?docked">docked</a>
        <a href="/?position=top-left">floating, top-left</a>
        <a href="/?position=bottom-left">floating, bottom-left</a>
        <a href="/?position=bottom-right">floating, bottom-right</a>
      </nav>
      <canvas id="canvas" width="480" height="270"></canvas>
      <pre id="values"></pre>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
